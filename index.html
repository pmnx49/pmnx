<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migration Help | Professional</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00ffa3;
            --neon-secondary: #00d1ff;
            --bg: #02060f;
            --glass: rgba(255, 255, 255, 0.04);
            --border: rgba(0, 255, 163, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Фоновая сетка */
        .cyber-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: 
                linear-gradient(rgba(0, 255, 163, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 163, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        header { padding: 50px 20px 30px; text-align: center; }
        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            letter-spacing: 5px;
            color: var(--neon);
            text-shadow: 0 0 20px rgba(0, 255, 163, 0.4);
            text-transform: uppercase;
        }

        .container { width: 100%; max-width: 480px; padding: 20px; }

        /* Статичная карточка без 3D наклона */
        .main-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            border-radius: 24px;
            border: 1px solid var(--border);
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            position: relative;
        }

        h2 { 
            font-family: 'Orbitron', sans-serif; 
            font-size: 14px; 
            margin-bottom: 30px; 
            text-align: center; 
            color: #fff; 
            opacity: 0.7;
            letter-spacing: 2px;
        }

        form { display: flex; flex-direction: column; gap: 16px; }

        input, select, textarea {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 16px;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        input:focus, select:focus, textarea:focus { 
            border-color: var(--neon); 
            background: rgba(0, 255, 163, 0.02);
        }

        select option { background: #0a192f; color: #fff; }

        textarea { min-height: 100px; resize: none; }

        .disclaimer {
            background: rgba(255, 171, 0, 0.05);
            border: 1px solid rgba(255, 171, 0, 0.1);
            padding: 14px;
            border-radius: 10px;
            display: flex; gap: 10px;
        }
        .disclaimer label { font-size: 10px; color: #ffab00; line-height: 1.5; }

        .captcha-box {
            background: rgba(0,0,0,0.2);
            border: 1px dashed var(--border);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
        #captchaTxt {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            color: var(--neon);
            letter-spacing: 12px;
            margin-bottom: 10px;
            user-select: none;
            opacity: 0.8;
            font-style: italic;
        }

        button {
            background: linear-gradient(135deg, var(--neon), var(--neon-secondary));
            color: #02060f;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }
        button:hover:not(:disabled) { 
            filter: brightness(1.1);
            box-shadow: 0 0 25px rgba(0, 255, 163, 0.4);
        }
        button:disabled { opacity: 0.3; cursor: not-allowed; }

        .status-section { 
            margin-top: 40px; 
            padding-top: 25px; 
            border-top: 1px solid rgba(255,255,255,0.05); 
        }
        .status-input-wrap { display: flex; gap: 8px; margin-top: 12px; }
        #statusId { flex: 1; background: rgba(255,255,255,0.03); border-style: dashed; }
        #statusResult {
            margin-top: 15px;
            padding: 15px;
            border-radius: 12px;
            display: none;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            border: 1px solid var(--neon);
            background: rgba(0, 255, 163, 0.05);
        }
    </style>
</head>
<body>

<div class="cyber-bg"></div>

<header><h1>MIGRATION HELP</h1></header>

<div class="container">
    <div class="main-card">
        <h2>НОВАЯ ЗАЯВКА</h2>
        <form id="orderForm">
            <input type="text" id="name" placeholder="ВАШЕ ИМЯ" required>
            <input type="tel" id="phone" placeholder="+77XXXXXXXXX" required pattern="^\+7\d{10}$">
            
            <select id="service" required>
                <option value="" disabled selected>ТИП УСЛУГИ</option>
                <option value="Верификация IMEI">ВЕРИФИКАЦИЯ IMEI</option>
                <option value="РВП / ВНЖ">РВП / ВНЖ</option>
                <option value="ИРС">РАЗРЕШЕНИЕ ИРС</option>
                <option value="Регистрация">РЕГИСТРАЦИЯ В МВД</option>
                <option value="Другое">ПРОЧЕЕ</option>
            </select>

            <textarea id="message" placeholder="СУТЬ ВОПРОСА..." required></textarea>

            <div class="disclaimer">
                <input type="checkbox" id="agree" required style="width: 18px; height: 18px;">
                <label for="agree">
                    ЧАСТНЫЙ КОНСАЛТИНГ. НЕ ГОСУДАРСТВЕННЫЙ ОРГАН. УСЛУГИ ПЛАТНЫЕ.
                </label>
            </div>

            <div class="captcha-box">
                <div id="captchaTxt">XXXXX</div>
                <input type="text" id="captchaIn" placeholder="ВВЕДИТЕ КОД" required>
            </div>

            <button type="submit" id="submitBtn">ОТПРАВИТЬ ЗАПРОС</button>
        </form>

        <div class="status-section">
            <p style="font-size: 10px; text-align: center; opacity: 0.4; letter-spacing: 1px;">ПРОВЕРКА ПО ID</p>
            <div class="status-input-wrap">
                <input type="text" id="statusId" placeholder="ID ЗАЯВКИ" readonly>
                <button onclick="checkStatus()" id="checkBtn" disabled style="padding: 10px 15px; font-size: 10px; margin-top:0;">НАЙТИ</button>
            </div>
            <div id="statusResult"></div>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://qwwytgkbeatehqtphzfd.supabase.co/functions/v1/telegram-notify";
    let currentCode = "";

    function generateCaptcha() {
        currentCode = Math.random().toString(36).substring(2, 7).toUpperCase();
        document.getElementById("captchaTxt").innerText = currentCode;
    }
    generateCaptcha();

    document.getElementById("orderForm").onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById("submitBtn");
        const captchaInput = document.getElementById("captchaIn").value.toUpperCase();

        if(captchaInput !== currentCode) {
            alert("ОШИБКА: НЕВЕРНЫЙ КОД!");
            return generateCaptcha();
        }

        btn.innerText = "ОТПРАВКА...";
        btn.disabled = true;

        try {
            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: document.getElementById("name").value,
                    phone: document.getElementById("phone").value,
                    service: document.getElementById("service").value,
                    message: document.getElementById("message").value
                })
            });
            
            const data = await res.json();

            if (!res.ok) {
                alert("ОШИБКА: " + (data.error || "Сервер отклонил запрос"));
            } else if (data.id) {
                alert("ЗАЯВКА №" + data.id + " УСПЕШНО СОЗДАНА");
                document.getElementById("statusId").value = data.id;
                document.getElementById("checkBtn").disabled = false;
                document.getElementById("orderForm").reset();
                generateCaptcha();
            }
        } catch (err) {
            alert("ОШИБКА СЕТИ: ПРОВЕРЬТЕ ИНТЕРНЕТ");
        } finally {
            btn.innerText = "ОТПРАВИТЬ ЗАПРОС";
            btn.disabled = false;
        }
    };

    async function checkStatus() {
        const id = document.getElementById("statusId").value;
        const out = document.getElementById("statusResult");
        out.style.display = "block";
        out.innerText = "ПОИСК В БАЗЕ...";

        try {
            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ type: "status", id: id })
            });
            const d = await res.json();
            const states = { 'pending': '⏳ В ОЖИДАНИИ', 'accepted': '✅ ПРИНЯТО', 'rejected': '❌ ОТКАЗАНО' };
            out.innerText = d.status === "not_found" ? "ID НЕ НАЙДЕН" : `СТАТУС: ${states[d.status] || d.status}`;
        } catch(e) { out.innerText = "ОШИБКА ЗАПРОСА"; }
    }
</script>
</body>
</html>
