<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Migration Help | Premium Consulting</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { 
        --accent: #00ffa3; 
        --accent-glow: rgba(0, 255, 163, 0.3);
        --bg: #050b14; 
        --glass: rgba(255, 255, 255, 0.03);
        --glass-border: rgba(255, 255, 255, 0.08);
        --text: #e0e6ed; 
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

    body { 
        background: var(--bg); 
        color: var(--text); 
        overflow-x: hidden;
        min-height: 100vh;
    }

    /* Живой фон */
    .bg-blobs {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: -1;
        overflow: hidden;
        background: radial-gradient(circle at 50% 50%, #0a192f 0%, #050b14 100%);
    }
    .blob {
        position: absolute;
        width: 400px; height: 400px;
        background: var(--accent-glow);
        filter: blur(100px);
        border-radius: 50%;
        animation: move 20s infinite alternate;
    }
    @keyframes move {
        from { transform: translate(-10%, -10%); }
        to { transform: translate(100%, 80%); }
    }

    header { 
        padding: 25px; 
        text-align: center; 
        background: rgba(5, 11, 20, 0.5);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--glass-border);
        position: sticky; top: 0; z-index: 100;
    }
    header h1 { 
        font-weight: 800; 
        letter-spacing: 2px; 
        background: linear-gradient(90deg, #fff, var(--accent));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-size: 24px;
    }

    section { max-width: 550px; margin: 40px auto; padding: 0 20px; position: relative; }

    .form-box { 
        background: var(--glass);
        backdrop-filter: blur(15px);
        padding: 40px; 
        border-radius: 28px; 
        border: 1px solid var(--glass-border);
        box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }

    h2 { text-align: center; margin-bottom: 30px; font-weight: 600; font-size: 22px; }

    form { display: flex; flex-direction: column; gap: 20px; }

    input, select, textarea { 
        width: 100%; padding: 16px; 
        border-radius: 14px; 
        border: 1px solid var(--glass-border); 
        background: rgba(255,255,255,0.02); 
        color: #fff; font-size: 15px; outline: none; 
        transition: all 0.3s ease;
    }

    /* ИСПРАВЛЕНИЕ БАГА СО СПИСКОМ */
    select option {
        background-color: #0a192f;
        color: #fff;
    }

    input:focus, select:focus, textarea:focus { 
        border-color: var(--accent); 
        background: rgba(255,255,255,0.05);
        box-shadow: 0 0 15px var(--accent-glow);
    }

    input[readonly] { 
        border-style: dashed; 
        color: var(--accent);
        background: rgba(255,255,255,0.01);
    }

    textarea { min-height: 120px; resize: none; }

    .captcha-area { 
        background: rgba(0,0,0,0.2); 
        padding: 20px; 
        border-radius: 16px; 
        text-align: center; 
        border: 1px solid var(--glass-border);
    }
    #captchaDisplay { 
        font-size: 28px; font-weight: 800; 
        letter-spacing: 12px; color: var(--accent); 
        margin-bottom: 12px; user-select: none; 
        text-decoration: line-through;
        opacity: 0.7;
    }

    .disclaimer-box {
        display: flex; gap: 12px;
        padding: 15px;
        background: rgba(255, 171, 0, 0.05);
        border-radius: 12px;
        border: 1px solid rgba(255, 171, 0, 0.1);
    }
    .disclaimer-text { font-size: 11px; color: #ffab00; line-height: 1.4; }

    button { 
        padding: 18px; border: none; 
        border-radius: 14px; 
        background: linear-gradient(135deg, var(--accent), #00c4ff);
        color: #050b14; font-weight: 800; 
        cursor: pointer; font-size: 16px; 
        transition: 0.4s;
    }
    button:hover:not(:disabled) { 
        transform: translateY(-3px); 
        box-shadow: 0 10px 20px var(--accent-glow);
    }
    button:disabled { opacity: 0.3; cursor: not-allowed; }

    .status-box { margin-top: 50px; }
    #statusResult { 
        margin-top: 20px; padding: 20px; 
        border-radius: 16px; display: none; 
        background: var(--glass);
        border: 1px solid var(--accent);
        text-align: center;
    }
  </style>
</head>
<body>

<div class="bg-blobs"><div class="blob"></div></div>

<header><h1>MIGRATION HELP</h1></header>

<section>
  <div class="form-box">
    <h2>Оставить заявку</h2>
    <form id="orderForm">
      <input type="text" id="name" placeholder="Ваше имя" required>
      <input type="tel" id="phone" placeholder="+77XXXXXXXXX" required pattern="^\+7\d{10}$">
      
      <select id="service" required>
        <option value="" disabled selected>Выберите тип услуги</option>
        <option value="Верификация IMEI">Верификация IMEI (телефоны)</option>
        <option value="РВП / ВНЖ">Оформление РВП / ВНЖ</option>
        <option value="ИРС">Разрешение на работу (ИРС)</option>
        <option value="Регистрация">Регистрация / Уведомление</option>
        <option value="Другое">Прочая консультация</option>
      </select>

      <textarea id="message" placeholder="Опишите ваш вопрос..." required></textarea>

      <div class="disclaimer-box">
        <input type="checkbox" id="agree" style="width:20px; height:20px;" required>
        <label for="agree" class="disclaimer-text">
            Я подтверждаю: данный ресурс является <b>частным консалтингом</b>. Мы не представляем МВД РК или ЦОН. Все услуги платные и носят консультационный характер.
        </label>
      </div>

      <div class="captcha-area">
        <div id="captchaDisplay">CODE</div>
        <input type="text" id="captchaInput" placeholder="Введите символы выше" required>
      </div>

      <button type="submit" id="submitBtn">Отправить запрос</button>
    </form>
  </div>

  <div class="status-box">
    <h3 style="text-align:center; margin-bottom: 20px;">Проверить статус</h3>
    <div style="display:flex; gap:10px;">
      <input type="text" id="statusId" placeholder="ID заполнится сам" readonly>
      <button onclick="checkStatus()" id="checkBtn" disabled style="padding:0 25px; font-size: 14px; background: var(--glass); color: #fff; border: 1px solid var(--glass-border);">Найти</button>
    </div>
    <div id="statusResult"></div>
  </div>
</section>

<script>
const API_URL = "https://qwwytgkbeatehqtphzfd.supabase.co/functions/v1/telegram-notify";
let currentCaptcha = "";

function refreshCaptcha() {
    currentCaptcha = Math.random().toString(36).substring(2, 7).toUpperCase();
    document.getElementById("captchaDisplay").innerText = currentCaptcha;
}
refreshCaptcha();

document.getElementById("orderForm").onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    const phone = document.getElementById("phone").value;
    const captchaIn = document.getElementById("captchaInput").value.toUpperCase();

    if (captchaIn !== currentCaptcha) {
        alert("Неверная капча!");
        return refreshCaptcha();
    }

    btn.innerText = "ОТПРАВКА...";
    btn.disabled = true;

    try {
        const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                name: document.getElementById("name").value,
                phone: phone,
                service: document.getElementById("service").value,
                message: document.getElementById("message").value
            })
        });
        
        const data = await res.json();
        if (data.id) {
            alert("Заявка №" + data.id + " создана!");
            document.getElementById("statusId").value = data.id;
            document.getElementById("checkBtn").disabled = false;
            document.getElementById("orderForm").reset();
            refreshCaptcha();
        }
    } catch (err) {
        alert("Ошибка сети!");
    } finally {
        btn.innerText = "Отправить запрос";
        btn.disabled = false;
    }
};

async function checkStatus() {
    const id = document.getElementById("statusId").value;
    const resDiv = document.getElementById("statusResult");
    resDiv.style.display = "block";
    resDiv.innerText = "Поиск...";

    try {
        const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ type: "status", id: id })
        });
        const data = await res.json();

        if (data.status === "not_found") {
            resDiv.innerText = "❌ Не найдено";
        } else {
            const states = { 'pending': '⏳ В ОБРАБОТКЕ', 'accepted': '✅ ПРИНЯТА', 'rejected': '❌ ОТКЛОНЕНА' };
            resDiv.innerText = `СТАТУС: ${states[data.status] || data.status}`;
            resDiv.style.borderColor = data.status === 'accepted' ? '#00ffa3' : (data.status === 'rejected' ? '#ff4b4b' : 'var(--glass-border)');
        }
    } catch (e) {
        resDiv.innerText = "Ошибка запроса";
    }
}
</script>
</body>
</html>
